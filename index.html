<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hoogbouwcasus VGGM 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div><div class="eyebrow">OEFENCASUS • HOOGBOUW</div><h1 id="appTitle">Hoogbouwcasus</h1></div>
  <button id="glossaryBtn" class="ghost">Begrippen</button>
</header>
<main class="shell">
  <section id="startScreen" class="card hero">
    <span class="status" id="status"></span>
    <h2 id="subtitle"></h2>
    <p id="building" class="lead"></p>
    <div class="principles" id="principles"></div>
    <p class="note"><strong>Werkwijze:</strong> je ziet geen punten of goed/fout-markering tijdens het spelen. Je keuze heeft een gevolg; daarna kun je de uitleg openen.</p>
    <button id="startBtn" class="primary">Start de inzet</button>
  </section>

  <section id="gameScreen" class="hidden">
    <div class="progressRow"><span id="progressText"></span><div class="progress"><div id="progressBar"></div></div></div>
    <article class="card incidentCard">
      <div class="roleLine"><span id="roleBadge" class="roleBadge"></span><span id="roleNote"></span></div>
      <div class="incidentTime" id="incidentTime"></div>
      <h2 id="nodeTitle"></h2>
      <p id="situation" class="situation"></p>
    </article>
    <section id="choicePanel" class="choicePanel"></section>
    <section id="resultPanel" class="hidden"></section>
  </section>

  <section id="endScreen" class="hidden"></section>
</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
 <div class="modalCard"><button id="modalClose" class="close" aria-label="Sluiten">×</button><div id="modalContent"></div></div>
</div>
<script src="scenario.js"></script><script src="app.js"></script>
</body></html>
