<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rivierstaete – Hoogbouwcasus VGGM 2026</title>
<link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoogbouwcasus">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="shortcut icon" href="assets/icons/Hoogbouwcasus.ico">

</head>
<body>
<header class="topbar">
  <div><div class="eyebrow">OEFENCASUS • HOOGBOUW</div><h1 id="appTitle">Hoogbouwcasus</h1></div>
  <div class="topActions"><a class="ghost linkButton" href="casussen.html">Casussen</a><button id="sourcesBtn" class="ghost">Bronnen</button><button id="glossaryBtn" class="ghost">Begrippen</button></div>
</header>
<main class="shell">
  <section id="startScreen" class="card hero">
    <div class="heroGrid">
      <div class="heroCopy">
        <span class="status" id="status"></span>
        <h2 id="subtitle"></h2>
        <p id="building" class="lead"></p>
        <div class="principles" id="principles"></div>
        <p class="note"><strong>Werkwijze:</strong> je ziet geen punten of goed/fout-markering tijdens het spelen. Je keuze heeft een gevolg; daarna kun je de uitleg openen.</p>
        <button id="startBtn" class="primary">Start de inzet</button>
      </div>
      <figure class="heroVisual"><img src="assets/vggm/hoogbouw_overzicht.jpeg" alt="Hoogbouwobject uit VGGM lesmateriaal"><figcaption>Beeld uit VGGM lesmateriaal hoogbouw</figcaption></figure>
    </div>
  </section>

  <section id="gameScreen" class="hidden">
    <div class="progressRow"><span id="progressText"></span><div class="progress"><div id="progressBar"></div></div></div>
    <article class="card incidentCard">
      <div class="roleLine"><span id="roleBadge" class="roleBadge"></span><span id="roleNote"></span></div>
      <div class="incidentTime" id="incidentTime"></div>
      <h2 id="nodeTitle"></h2>
      <p id="situation" class="situation"></p>
    </article>
    <section id="choicePanel" class="choicePanel"></section>
    <section id="resultPanel" class="hidden"></section>
  </section>

  <section id="endScreen" class="hidden"></section>
</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
 <div class="modalCard"><button id="modalClose" class="close" aria-label="Sluiten">×</button><div id="modalContent"></div></div>
</div>
<script src="scenario-rivierstaete.js"></script><script src="app.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(reg => reg.update())
      .catch(err => console.warn('Service worker kon niet worden geregistreerd:', err));
  });
}
</script>

</body></html>
